<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="canonical" href="{{url}}">
<!-- Link previews (Open Graph: LinkedIn, Slack, WhatsApp, iMessage, Mastodon; Twitter card: X). -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="omajot">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta property="og:image" content="{{image}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="omajot: notes that sync. Privately.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{image}}">
<link rel="stylesheet" href="assets/site.css">
<script>try{var t=localStorage.getItem('omajot-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body class="page-{{page}}">
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <a class="brand" href="index.html" aria-label="omajot home">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="3" width="22" height="26" rx="5" fill="var(--accent)"/><rect x="5" y="3" width="22" height="7" rx="3" fill="var(--accent-deep)"/><path d="M10 15h12M10 19.5h12M10 24h7" stroke="var(--paper)" stroke-width="2.2" stroke-linecap="round"/></svg>
    <span>omajot</span>
  </a>
  <button class="menu" aria-expanded="false" aria-controls="nav">Menu</button>
  <nav id="nav">
{{nav}}
  </nav>
  <div class="tools">
    <button class="theme" title="Switch light / dark" aria-label="Switch light or dark theme">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg>
    </button>
    <a class="gh" href="{{repo}}" aria-label="omajot on GitHub"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.05-.49.05-.49.8.06 1.23.83 1.23.83.72 1.22 1.87.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg></a>
  </div>
</header>
<main id="main">
{{content}}
</main>
<footer class="foot">
  <span>omajot · MIT license · {{year}}</span>
  <span>Built with <a href="https://ziglang.org/">Zig</a>, <a href="https://technologylab-ai.github.io/baz/">baz</a> on <a href="https://technologylab-ai.github.io/bounded-http/">bounded/http</a>, and <a href="https://quickshell.org/">Quickshell</a>.</span>
  <a href="{{repo}}">Source on GitHub</a>
</footer>
<script src="assets/site.js"></script>
</body>
</html>
